- cell_line: NCI-H2228
  drug: Dabrafenib
  label: RESISTANT

# =============================================================================
# GROUP 24 — PIK3CA H1047R breast: PI3K inhibitor vs. PARP wrong-target
# =============================================================================

# Juric et al. 2015 Cancer Discov (SOLAR-1 basis); Fabbro et al. 2015;
# Synergistic Actions of Alpelisib and Melatonin in Breast Cancer 2023
# (PMID 37086897). MDA-MB-453 carries PIK3CA H1047R (hotspot, confirmed
# in genomics DB). Alpelisib is FDA-approved for PIK3CA-mutated breast cancer.
# GDSC alpelisib z=-2.23 (SENSITIVE). MDA-MB-453 LAR subtype TNBC;
# PI3K pathway is the dominant oncogenic driver.
# T1-leads: PIK3CA H1047R is a hotspot activating mutation.
- cell_line: MDA-MB-453
  drug: Alpelisib
  label: SENSITIVE

# MDA-MB-453 + Olaparib: PIK3CA H1047R driver but BRCA1/2 wild-type (no
# HRR-deficiency driver confirmed in genomics DB). PARP inhibitor synthetic
# lethality requires homologous recombination deficiency. Without BRCA LOF,
# MDA-MB-453 repairs PARP-induced SSBs via intact HR. GDSC z=+0.46 (UNCERTAIN
# bordering RESISTANT). Wrong-target case: PI3K activation ≠ HRD.
# T1-leads: T1 correctly finds no BRCA LOF and predicts RESISTANT.
- cell_line: MDA-MB-453
  drug: Olaparib
  label: RESISTANT

# =============================================================================
# GROUP 25 — BRCA1/2 LOF: expanded PARP inhibitor sensitivity panel
# =============================================================================

# Ganzfried et al. 2013 PMID 23415752 (BRCA1/2 mutation analysis in 41 ovarian
# cell lines). IGROV-1 carries BRCA1 K654SfsTer47 frameshift deletion (driver,
# confirmed in genomics DB). Fong et al. 2010 J Clin Oncol — olaparib in
# BRCA1/2-mutant ovarian cancer. GDSC olaparib z=-0.29 (UNCERTAIN) due to
# population-wide z-score calibration, but BRCA1 frameshift is unambiguous HRD.
# T1-leads: BRCA1 LOF is the sensitising event. GDSC under-calls this sensitivity;
# system must rely on T1/T3 evidence over T4's UNCERTAIN signal.
- cell_line: IGROV-1
  drug: Olaparib
  label: SENSITIVE

# Sakai et al. 2008 Cancer Res (PEO1 vs PEO4 olaparib pair); Fong et al. 2009
# NEJM. PEO1 carries BRCA2 Y1655Ter (truncating SNV, driver confirmed in
# genomics DB). This is the canonical BRCA2-mutant ovarian cancer cell line used
# to establish synthetic lethality. GDSC olaparib z=+1.37 (anomalously RESISTANT)
# — known GDSC calibration artefact for this line; biology unambiguously SENSITIVE.
# T1-WRONG (T4): T4 sees high GDSC IC50 and argues RESISTANT. T1 detects BRCA2
# truncation driver and must override — a critical axiom-hierarchy test.
- cell_line: PEO1
  drug: Olaparib
  label: SENSITIVE

# Multi-omics characterization of olaparib resistance in HCC1395 (PMC12355081);
# BRCA1 R1751Ter + BRCA2 E1593Ter (both driver truncations, confirmed in
# genomics DB) — dual BRCA LOF, strongest HRD phenotype in this panel.
# GDSC olaparib z=-0.56 (SENSITIVE). Literature confirms ~95% growth inhibition
# in BRCA1-mutant breast lines treated with olaparib.
# T1-leads: dual BRCA driver mutations provide unambiguous HRD signal.
- cell_line: HCC1395
  drug: Olaparib
  label: SENSITIVE

# Litton et al. 2018 NEJM (EMBRACA, PMID 30110579). CAL-51 carries BRCA2
# N986IfsTer5 frameshift deletion (driver, confirmed in genomics DB).
# Talazoparib is a more potent PARP trapper than olaparib; GDSC z=-1.36 (SENSITIVE).
# T1-leads: BRCA2 frameshift LOF is the sensitising event; mechanism identical
# to CAPAN-1 (Group 7) but with talazoparib as the PARP inhibitor.
- cell_line: CAL-51
  drug: Talazoparib
  label: SENSITIVE

# =============================================================================
# GROUP 26 — BRCA-WT: olaparib resistance in BRCA-proficient settings
# =============================================================================

# Targeting PARP-1 and DDR defects in CRC (PMID 39456536). SW1417 is a
# BRAF V600E colorectal cancer line; BRCA1/2 wild-type (no LOF mutation in
# genomics DB). PARP inhibitor synthetic lethality requires HRD; without BRCA
# LOF, HR is intact and SSBs are efficiently repaired. GDSC olaparib z=+2.17
# (strongly RESISTANT). Tests whether system avoids false-positive PARP
# sensitivity prediction in BRCA-proficient CRC.
# T1-leads: T1 finds no BRCA LOF; correctly predicts RESISTANT.
- cell_line: SW1417
  drug: Olaparib
  label: RESISTANT

# PC-3 + Olaparib: PTEN-null prostate cancer (PC-3 is the canonical PTEN-null
# model). Some early data suggested PTEN loss might confer HRD-like sensitivity
# to PARP inhibitors (Mendes-Pereira 2009), but this was not clinically validated.
# PC-3 has no BRCA1/2 LOF (genomics DB confirms only TP53 frameshift).
# GDSC olaparib z=+0.87 (RESISTANT). PTEN deletion alone is insufficient for
# synthetic lethality with PARP inhibitors in this setting.
# T1-leads: T1 finds PTEN loss (CNV) but no BRCA LOF; T3 confirms HR pathway
# remains intact → RESISTANT.
- cell_line: PC-3
  drug: Olaparib
  label: RESISTANT

# =============================================================================
# GROUP 27 — KRAS-mutant NSCLC: differential response by drug mechanism
# =============================================================================

# Pao et al. 2005 PLoS Med; De Langen et al. 2021. KRAS mutations activate
# RAS/MAPK downstream of EGFR, making EGFR-targeted therapy ineffective.
# NCI-H1573 carries KRAS G12A (driver, confirmed in genomics DB).
# GDSC erlotinib label = SENSITIVE (z=-1.13) — an apparent contradiction;
# the gold standard follows biology: KRAS G12A confers EGFR-TKI resistance.
# T1-WRONG (T4): T4 reads the anomalous GDSC IC50 and argues SENSITIVE;
# T1 correctly identifies KRAS G12A as the downstream bypass driver.
- cell_line: NCI-H1573
  drug: Erlotinib
  label: RESISTANT

# Blumenschein et al. 2015 Lancet Oncol (Phase II trametinib in KRAS-mutant NSCLC).
# NCI-H2009 carries KRAS G12A (driver, confirmed in genomics DB). KRAS activates
# MAPK → RAF → MEK → ERK; MEK inhibitor blocks this axis downstream of the oncogene.
# GDSC trametinib z=-0.96 (SENSITIVE). Contrasts with H1573 + erlotinib (RESISTANT)
# — same KRAS mutation, opposite outcomes depending on drug mechanism.
# Multi: T1 identifies KRAS G12A; T3 confirms MAPK pathway activity; T4 agrees.
- cell_line: NCI-H2009
  drug: Trametinib
  label: SENSITIVE

# NCI-H1573 + Crizotinib: KRAS G12A NSCLC, no ALK/ROS1/MET rearrangement
# (confirmed absent from genomics DB). Crizotinib targets ALK, ROS1, and MET
# — none of which are the oncogenic driver here. GDSC z=+1.05 (RESISTANT).
# Paired wrong-target control to H1573+erlotinib. Tests whether system
# correctly identifies KRAS G12A as driver and finds no crizotinib target.
- cell_line: NCI-H1573
  drug: Crizotinib
  label: RESISTANT

# HCC-44 + Trametinib: KRAS G12C NSCLC (confirmed in genomics DB). Like NCI-H2009,
# KRAS G12C activates MAPK and renders cells MEK-dependent. GDSC z=-1.11 (SENSITIVE).
# G12C is the most therapeutically tractable KRAS mutation (sotorasib targets it
# directly); MEK inhibitor is the alternative pathway blockade strategy.
# Literature: Engelman et al. 2008; Janne et al. 2013 Clin Cancer Res.
- cell_line: HCC-44
  drug: Trametinib
  label: SENSITIVE

# =============================================================================
# GROUP 28 — Wrong-target: BRAF inhibitor in ALK-driven neuroblastoma
# =============================================================================

# Carpenter & Mossé 2012 Nat Med; Berry et al. 2012 Cancer Res.
# KELLY is an ALK F1174L gain-of-function neuroblastoma line (driver mutation
# confirmed in genomics DB). F1174L is a known oncogenic ALK activation mutation.
# PLX-4720 targets BRAF V600E — no BRAF mutation is present in KELLY (BRAF WT
# confirmed in genomics DB). GDSC PLX-4720 z=-0.14 (UNCERTAIN, not SENSITIVE).
# The gold standard is RESISTANT: no relevant BRAF target; ALK is the driver.
# T1-leads: T1 finds ALK F1174L and BRAF-WT; correctly predicts no BRAF-inhibitor
# sensitivity. T4's UNCERTAIN signal should not be misread as efficacy.
- cell_line: KELLY
  drug: PLX-4720
  label: RESISTANT

# =============================================================================
# GROUP 29 — BCR-ABL+ CML: additional 2nd-gen TKI sensitivity cases
# =============================================================================

# Weisberg et al. 2006 Cancer Cell 9:47-56 (nilotinib); Shah et al. 2004 Science
# 305:399-401 (dasatinib). KCL-22 and LAMA-84 are both BCR-ABL+ CML lines
# (BCR-ABL fusion confirmed in literature; not captured as point mutation in our
# COSMIC-based DB because it is a chromosomal translocation, not a SNV).
# GDSC nilotinib z=-4.54 and dasatinib z=-3.58 for KCL-22 (extremely SENSITIVE);
# GDSC nilotinib z=-5.74 and dasatinib z=-4.12 for LAMA-84 (most sensitive signals
# in the entire panel). Complements K-562 cases in Group 6.
# T1-leads: BCR-ABL fusion drives CML; both drugs inhibit BCR-ABL kinase.
- cell_line: KCL-22
  drug: Nilotinib
  label: SENSITIVE

- cell_line: KCL-22
  drug: Dasatinib
  label: SENSITIVE

- cell_line: LAMA-84
  drug: Nilotinib
  label: SENSITIVE

- cell_line: LAMA-84
  drug: Dasatinib
  label: SENSITIVE

# =============================================================================
# GROUP 30 — FLT3-ITD AML: lestaurtinib and mTOR inhibitor sensitivity
# =============================================================================

# Knapper et al. 2006 Blood 108:3262-3270 (PMID 16189267); Smith et al. 2004 Blood.
# MOLM-13 carries FLT3 E598_Y599insFDFREYE in-frame insertion (confirmed in
# genomics DB) — a FLT3-ITD that constitutively activates FLT3 kinase.
# Lestaurtinib (CEP-701) is a FLT3/JAK2 inhibitor; GDSC z=-3.08 (SENSITIVE).
# T1-leads: FLT3-ITD insertion is the oncogenic driver; lestaurtinib inhibits
# the activated kinase directly.
- cell_line: MOLM-13
  drug: Lestaurtinib
  label: SENSITIVE

# FLT3-ITD activates PI3K/AKT/mTOR downstream (Xu et al. 2003 Blood;
# Recher et al. 2005 Blood). Temsirolimus (mTOR inhibitor) blocks this
# downstream effector. GDSC temsirolimus z=-4.22 (most sensitive signal in
# the pharmacology panel for MOLM-13). Complements PC-3+Temsirolimus (Group 31)
# but with a different upstream driver (FLT3-ITD vs. PTEN-null).
# Multi: T1 identifies FLT3-ITD; T3 (Pathway) detects PI3K/mTOR pathway
# activation downstream of FLT3 → T4 confirms sensitivity.
- cell_line: MOLM-13
  drug: Temsirolimus
  label: SENSITIVE

# =============================================================================
# GROUP 31 — PTEN-null prostate: mTOR sensitivity vs. PARP inhibitor resistance
# =============================================================================

# Neshat et al. 2001 PNAS 98:10314-10319; Guertin & Sabatini 2009 Cancer Cell.
# PC-3 is the canonical PTEN-null prostate cancer model — PTEN homozygous deletion
# results in constitutive PI3K/AKT/mTOR activation. Temsirolimus (mTOR inhibitor)
# blocks the pathway activated by PTEN loss. GDSC z=-1.29 (SENSITIVE).
# T2-leads: T1 sees PTEN CNV deletion but no standard drug-target mutation;
# T2/T3 detect PI3K/mTOR pathway hyperactivation and correctly predict sensitivity.
- cell_line: PC-3
  drug: Temsirolimus
  label: SENSITIVE

# =============================================================================
# GROUP 32 — RB1 truncating mutation → CDK4/6 inhibitor RESISTANT
# =============================================================================
# Knudsen & Bhatt 2019 Cancer Cell; Finn et al. 2009 Breast Cancer Res;
# Lapenna & Bhatt 2018 Nat Rev Drug Discov. RB1 encodes the direct substrate
# of CDK4/6; truncating mutations abolish CDK4/6 substrate → palbociclib/
# ribociclib cannot suppress cell cycle because the brake (RB1) is already
# destroyed. Pharmacological signal is expected RESISTANT even though the
# drug still blocks CDK4/6 enzymatic activity.

# 5637 (bladder carcinoma, ATCC HTB-9) carries RB1 Y325Ter (confirmed genomics
# DB). Bladder cancer frequently harbours RB1 loss (Croft et al. 2013 Nat Genet).
# GDSC palbociclib z=+0.51 (RESISTANT). T1-leads: T1 finds RB1 LOF → predicts
# CDK4/6i ineffective regardless of drug mechanism.
- cell_line: "5637"
  drug: Palbociclib
  label: RESISTANT

# 5637 + Ribociclib: same RB1 Y325Ter driver, different CDK4/6 inhibitor.
# GDSC ribociclib z=+0.54 (RESISTANT). Tests T1 generalisation across drug class.
- cell_line: "5637"
  drug: Ribociclib
  label: RESISTANT

# DU-145 (prostate adenocarcinoma) carries RB1 K715Ter (confirmed genomics DB).
# RB1 loss is a defining event in castration-resistant prostate cancer (Armenia
# et al. 2018 Nat Genet). GDSC palbociclib z=+1.60 (strongest CDK4/6i RESISTANT
# signal in this panel). T1-leads: T1 identifies RB1 K715Ter as driver LOF;
# T3 confirms cell-cycle G1-checkpoint bypass → RESISTANT.
- cell_line: DU-145
  drug: Palbociclib
  label: RESISTANT

# DU-145 + Ribociclib: same RB1 K715Ter mechanism. GDSC z=+0.98 (RESISTANT).
# Confirms drug-class consistency of the T1-led prediction.
- cell_line: DU-145
  drug: Ribociclib
  label: RESISTANT

# =============================================================================
# GROUP 33 — TP53 truncating/GOF mutation → MDM2-inhibitor (Nutlin-3a) RESISTANT
# =============================================================================
# Vassilev et al. 2004 Science 303:844-848 (original Nutlin paper) showed
# TP53-mutant/null cells are intrinsically resistant because Nutlin-3a works
# by blocking MDM2-TP53 interaction — mutant p53 cannot be reactivated.
# Ray-Coquard et al. 2012 Lancet Oncol confirmed TP53 status as the key
# biomarker for MDM2-inhibitor response.

# SW620 (colorectal carcinoma) carries TP53 R273H (hotspot GOF mutation,
# confirmed genomics DB as driver). GDSC Nutlin-3a (-) z=+1.41 (RESISTANT).
# T1-leads: T1 identifies TP53 R273H as GOF driver; T3 confirms MDM2-TP53
# axis is abrogated → drug cannot restore p53 tumour suppressor function.
- cell_line: SW620
  drug: Nutlin-3a (-)
  label: RESISTANT

# HOP-62 (NSCLC, NCI-60) carries KRAS G12C + TP53 driver SNV (confirmed
# genomics DB). GDSC Nutlin-3a (-) z=+1.36 (RESISTANT). The TP53 mutation
# (not KRAS) explains Nutlin-3a resistance; KRAS status is irrelevant here.
# T1-leads: T1 reports TP53 driver mutation → MDM2 inhibitor ineffective.
- cell_line: HOP-62
  drug: Nutlin-3a (-)
  label: RESISTANT

# Calu-6 (lung carcinoma) carries TP53 R196Ter (truncating nonsense mutation,
# confirmed genomics DB as driver). GDSC Nutlin-3a (-) z=+1.07 (RESISTANT).
# TP53 truncation prevents any functional p53 protein that Nutlin could
# stabilise. T1-leads: T1 identifies TP53 R196Ter LOF; T3 confirms.
- cell_line: Calu-6
  drug: Nutlin-3a (-)
  label: RESISTANT

# =============================================================================
# GROUP 34 — KRAS oncogenic mutation → EGFR-TKI class RESISTANT
# =============================================================================
# Pao et al. 2005 PLoS Med 2:e17; Benvenuti et al. 2007 Cancer Res.
# Activating KRAS mutations constitutively engage RAS/MAPK downstream of
# EGFR, making all EGFR-targeted TKIs (erlotinib, gefitinib, afatinib)
# ineffective regardless of EGFR status. KRAS mutations are the primary
# negative predictive biomarker for EGFR-TKI therapy.

# SW620 (CRC) carries KRAS G12V (driver, confirmed genomics DB).
# GDSC erlotinib z=+1.61 (RESISTANT). De Roock et al. 2010 Lancet Oncol
# confirmed KRAS G12V confers erlotinib resistance in CRC.
- cell_line: SW620
  drug: Erlotinib
  label: RESISTANT

# SW620 + Gefitinib: same KRAS G12V driver, same class, different molecule.
# GDSC gefitinib z=+1.83 (strongest EGFR-TKI RESISTANT signal here).
# Tests T1 generalisation across EGFR-TKI class in CRC.
- cell_line: SW620
  drug: Gefitinib
  label: RESISTANT

# A427 (lung adenocarcinoma) carries KRAS G12D (driver, confirmed genomics
# DB). GDSC erlotinib z=+1.14 (RESISTANT). Pao et al. 2005 demonstrated
# KRAS G12D confers erlotinib resistance in NSCLC. T1-leads: T1 identifies
# KRAS G12D; T3 confirms downstream bypass of EGFR.
- cell_line: A427
  drug: Erlotinib
  label: RESISTANT

# A427 + Afatinib: KRAS G12D also confers resistance to 2nd-generation
# irreversible EGFR/HER2 inhibitor afatinib. GDSC z=+0.92 (RESISTANT).
# Yang et al. 2012 Lancet Oncol: KRAS mutations predict afatinib non-response.
- cell_line: A427
  drug: Afatinib
  label: RESISTANT

# HOP-62 (NSCLC, NCI-60) carries KRAS G12C (driver, confirmed genomics DB)
# + TP53 driver. GDSC gefitinib z=+1.34 (RESISTANT). KRAS G12C is the same
# codon targeted by sotorasib/adagrasib (direct inhibitors), but EGFR-TKIs
# cannot overcome the downstream RAS bypass. T1-leads: T1 identifies KRAS
# G12C + TP53; T3 confirms EGFR-TKI resistance via constitutive RAS signaling.
- cell_line: HOP-62
  drug: Gefitinib
  label: RESISTANT

# =============================================================================
# GROUP 35 — SCLC (RB1+TP53 null): no EGFR sensitizing mutation → TKI RESISTANT
# =============================================================================
# Jackman et al. 2009 J Clin Oncol; Byers et al. 2012 J Thorac Oncol.
# Small cell lung cancer (SCLC) is defined by bi-allelic RB1+TP53 loss and
# is universally EGFR-TKI resistant — EGFR sensitizing mutations (exon 19
# deletions, L858R) are virtually absent in SCLC (<1%). No sensitizing
# mutation = no oncogene addiction = TKI has no relevant target.

# COR-L32 (SCLC cell line) carries RB1 L64Ter (driver, confirmed genomics
# DB). No EGFR sensitizing mutation in genomics DB. GDSC erlotinib z=+1.89
# (strongest EGFR-TKI RESISTANT signal in this panel). T1-leads: T1 finds
# RB1 LOF (SCLC signature) and no EGFR driver → RESISTANT.
- cell_line: COR-L32
  drug: Erlotinib
  label: RESISTANT

# DMS-79 (SCLC) carries RB1 G801Ter + TP53 R280EfsTer65 (both drivers,
# confirmed genomics DB) — canonical SCLC genotype. GDSC erlotinib z=+1.20
# (RESISTANT). No EGFR sensitizing mutation. Mechanistically identical to
# COR-L32; tests that T1 identifies the RB1+TP53 SCLC signature correctly.
- cell_line: DMS-79
  drug: Erlotinib
  label: RESISTANT

# DMS-79 + Afatinib: SCLC, RB1+TP53 null, no HER2/EGFR amplification.
# GDSC afatinib z=+0.99 (RESISTANT). Confirms SCLC resistance to pan-HER
# inhibitor class as well — no HER2 amplification to be targeted.
- cell_line: DMS-79
  drug: Afatinib
  label: RESISTANT

# =============================================================================
# GROUP 36 — No BRAF V600E mutation → BRAF-selective inhibitor RESISTANT
# =============================================================================
# Nazarian et al. 2010 Nature 468:973-977; Flaherty et al. 2010 NEJM.
# PLX4720 (analogue of vemurafenib) and dabrafenib are paradox-inducing
# RAF inhibitors that are selectively active only in BRAF V600E context;
# in BRAF-WT or RAS-mutant cells they paradoxically activate MAPK signaling
# (Poulikakos et al. 2010 Nature). T1 identifying the absence of BRAF V600E
# should predict RESISTANT regardless of pharmacology signal.

# DU-145 (prostate, RB1 K715Ter): no BRAF V600E in genomics DB.
# GDSC PLX-4720 z=+1.52 (RESISTANT). Prostate cancer has ~1% BRAF V600E rate;
# DU-145 carries none. T1-leads: T1 finds no BRAF V600E; T3 confirms absence
# of V600E-driven MAPK addiction → RESISTANT.
- cell_line: DU-145
  drug: PLX-4720
  label: RESISTANT

# DU-145 + Dabrafenib: same no-BRAF-V600E reasoning, second-generation
# inhibitor. GDSC z=+0.81 (RESISTANT). Confirms class consistency.
- cell_line: DU-145
  drug: Dabrafenib
  label: RESISTANT

# HOP-62 (NSCLC, KRAS G12C): no BRAF V600E in genomics DB. KRAS-mutant
# cells are paradox-activating for RAF inhibitors. GDSC PLX-4720 z=+0.87
# (RESISTANT). Montagut & Settleman 2009 Trends Pharmacol Sci.
- cell_line: HOP-62
  drug: PLX-4720
  label: RESISTANT

# SW620 (CRC, KRAS G12V): no BRAF V600E. GDSC PLX-4720 z=+0.82 (RESISTANT).
# CRC BRAF V600E mutations are mutually exclusive with KRAS mutations
# (Rajagopalan et al. 2002 Nature). SW620 carries KRAS G12V; absence of
# BRAF V600E confirmed in genomics DB.
- cell_line: SW620
  drug: PLX-4720
  label: RESISTANT

# COR-L32 (SCLC, RB1 L64Ter): no BRAF V600E. GDSC PLX-4720 z=+0.70
# (RESISTANT). SCLC is BRAF V600E-negative (<0.5% frequency).
# T1-leads: T1 finds RB1 LOF + no BRAF driver → PLX-4720 has no target.
- cell_line: COR-L32
  drug: PLX-4720
  label: RESISTANT

# =============================================================================
# GROUP 37 — No relevant target amplification/fusion → targeted therapy RESISTANT
# =============================================================================
# Wrong-target class: the drug requires a specific amplified/fusion driver
# (HER2 amplification for lapatinib; BCR-ABL fusion for nilotinib) that is
# absent in these cell lines. Geyer et al. 2006 NEJM (lapatinib only active
# in HER2-positive breast cancer); Druker et al. 2001 NEJM (nilotinib/
# imatinib requires BCR-ABL). T1 identifying the absent driver → RESISTANT.

# DU-145 (prostate, RB1 K715Ter): no HER2 amplification in genomics DB.
# GDSC lapatinib z=+1.46 (RESISTANT). Prostate cancer rarely amplifies HER2;
# lapatinib has no oncogenic driver to inhibit here.
- cell_line: DU-145
  drug: Lapatinib
  label: RESISTANT

# SW620 (CRC, KRAS G12V): no HER2 amplification. GDSC lapatinib z=+1.29
# (RESISTANT). HER2 amplification in CRC is ~3%; mutually exclusive with
