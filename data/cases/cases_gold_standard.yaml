# T1-leads: CIViC ERBB2-amp sensitivity to HER2-targeted TKIs.
- cell_line: AU565
  drug: Lapatinib
  label: SENSITIVE

- cell_line: AU565
  drug: Afatinib
  label: SENSITIVE

# HCC1419: ERBB2 CNV=20x amplification (CCLE — strongest HER2 amp in panel).
# Lapatinib z=-1.25 (SENSITIVE in GDSC). Well-documented HER2-amplified breast
# line used in resistance mechanism studies (heregulin-mediated escape; Hegde 2013).
# T1-leads: ERBB2 amplification at extreme level; same mechanism as BT-474.
- cell_line: HCC1419
  drug: Lapatinib
  label: SENSITIVE

# =============================================================================
# GROUP 22 — EGFR exon 18 uncommon mutation: NCI-H1648
# =============================================================================

# Yang et al. 2015 Clin Cancer Res (PMID 26206867); Sequist et al. 2011
# Sci Transl Med. NCI-H1648 carries EGFR G719S (exon 18 uncommon mutation;
# confirmed in multiple mutation databases though not captured by our COSMIC
# caller). Exon 18 G719X mutations sensitise cells to 1st-gen erlotinib and
# especially 2nd-gen afatinib. GDSC erlotinib z=-2.12 and afatinib z=-2.13
# (both SENSITIVE) — among the strongest TKI signals in the GDSC panel.
# T1-leads: EGFR G719S is an activating mutation; CIViC/OncoKB annotate
