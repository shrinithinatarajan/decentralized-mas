- cell_line: SW620
  drug: Lapatinib
  label: RESISTANT

# DMS-79 (SCLC, RB1+TP53 null): no HER2 amplification. GDSC lapatinib
# z=+1.31 (RESISTANT). SCLC has no HER2 amplification; lapatinib has
