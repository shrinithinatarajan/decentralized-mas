# Wang et al. 2021 PMC8007737 (comparative drug response in HER2-amplified lines).
# AU565: ERBB2 CNV=10x amplification (CCLE). Lapatinib z=-2.58, Afatinib z=-2.12
# (both SENSITIVE in GDSC). AU565 parental line is lapatinib-sensitive; HER2L755S
