- cell_line: SW620
  drug: Nilotinib
  label: RESISTANT

# HOP-62 (NSCLC, KRAS G12C + TP53 driver): no BCR-ABL fusion. GDSC nilotinib
# z=+1.03 (RESISTANT). NSCLC does not carry BCR-ABL rearrangements; nilotinib
