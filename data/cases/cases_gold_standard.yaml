# =============================================================================
# GROUP 20 — BRAF V600E CRC: EGFR feedback determines PLX-4720 response
# =============================================================================

# Prahallad et al. 2012 Nature 483:100-103 (PMID 22281684). BRAF V600E is
# present in ~10% of colorectal cancers but BRAF inhibitor monotherapy is largely
# ineffective due to EGFR-mediated feedback reactivation. HT-29 shows this
# feedback; RKO does not — RKO is directly sensitive to PLX-4720.
# RKO BRAF V600E confirmed in genomics DB. GDSC PLX-4720 z=-0.86 (SENSITIVE).
# T1-leads for RKO (BRAF V600E driver). Multi for HT-29: T1 predicts SENSITIVE
# (BRAF V600E) but T3 (Pathway) must detect intact EGFR feedback bypass.
- cell_line: HT-29
  drug: PLX-4720
  label: RESISTANT

- cell_line: RKO
  drug: PLX-4720
  label: SENSITIVE

# RKO + Trametinib: BRAF V600E CRC, MEK inhibitor downstream of BRAF.
# GDSC Trametinib z=-0.99 (SENSITIVE). Trametinib blocks ERK output regardless
# of EGFR feedback (which reactivates BRAF/CRAF dimers, not MEK directly).
# Paired contrast to HT-29 which is also Trametinib SENSITIVE (BRAF drives MEK).
- cell_line: RKO
  drug: Trametinib
  label: SENSITIVE

